{% extends 'base.html' %}{% block content %}<section class="card"><h1>确认重置演示数据</h1><p>此操作删除本地演示工单、流转历史、解析/提醒记录，演示时钟归零，并建立三条虚构待分派样本。会使所有旧会话/表单失效。不会触碰源文档、配置、密钥或任意指定路径。</p><p>仅清理数据库登记且路径校验通过的演示照片，不递归删除孤立文件。文件被其他程序占用时可能残留私有文件，但不再有可访问附件记录，不打入交付包。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="reset_token" value="{{ reset_token }}"><label>输入“重置演示数据”确认<input name="confirmation" required autocomplete="off"></label><button>确认重置演示数据</button></form><a href="{{ url_for('workspaces.workspace') }}">取消，返回工作台</a></section>{% endblock %}
